# Comprueba cada PR: tipos, pruebas de la lógica y la partida simulada (sin publicar).
name: Comprobar

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # el Chromium de Playwright para la partida simulada
      # (si los servidores de Ubuntu no responden, solo el navegador: las máquinas de GitHub ya traen casi todo lo demás)
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      # (construye la versión publicable y juega una partida en ella)
      - run: npm run test:e2e
        env:
          NODE_ENV: production
          E2E_SHOTS: e2e-capturas
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-partida-simulada
          path: e2e-capturas
          if-no-files-found: ignore
